<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Mobile-safe viewport: prevents iOS Safari from zooming on form focus -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF0F3" />
  <meta name="description" content="ToneWear — AI-powered skin tone detection & cross-platform fashion price comparison for Amazon, Flipkart, Myntra, Ajio & Nykaa." />
  <title>ToneWear | AI Skin Tone Fashion Advisor</title>

  <!-- Step 1: preconnect to font origins (eliminates DNS + TLS RTT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--
    Reverted Font Strategy:
    • Poppins (Primary) — 300,400,500,600,700,800
    • Inter (Body) — 400,500,600
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
